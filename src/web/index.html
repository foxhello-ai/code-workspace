<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <title>Code Workspace</title>
    <style>
      :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d1117;color:#d7dde5;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{color:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:default}
      .boot-screen,.login-page{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 20%,#192739,#0c1117 55%)}.boot-screen{flex-direction:column;gap:12px}.boot-screen>.module-loading{flex:0;min-height:0;padding:8px}.boot-screen h1{font-size:22px;font-weight:600;margin:0}.boot-screen p{color:#9ba8b8}.boot-screen button,.module-error button{border:1px solid #3a4554;border-radius:6px;padding:8px 14px;background:#202731}
      .module-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:24px;color:#9ba8b8;min-height:100px;flex:1}.module-error{flex-direction:column;text-align:center}.module-error p{margin:0}.boot-spinner{width:16px;height:16px;flex-shrink:0;border:2px solid #344559;border-top-color:#79a7d8;border-radius:50%;animation:boot-spin 1s linear infinite}@keyframes boot-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.boot-spinner{animation:none}}
      .login-card{width:min(420px,calc(100vw - 32px));padding:38px;background:#161c24;border:1px solid #303947;border-radius:12px;box-shadow:0 24px 70px #0008;display:flex;flex-direction:column;gap:12px}.login-card h1{margin:4px 0 0;font-size:23px}.login-card p{margin:0 0 10px;color:#8d99a8}.login-card label{font-size:12px;color:#aeb7c3}.login-card input{width:100%;min-width:0;background:#0d1117;border:1px solid #3a4554;color:white;border-radius:6px;padding:11px;outline:none}.login-card input:focus{border-color:#58a6ff;box-shadow:0 0 0 2px #58a6ff33}.login-logo{width:46px;height:46px;display:grid;place-items:center;border-radius:10px;background:#1768ac;color:white}.login-submit{border:0;border-radius:6px;padding:10px 16px;background:#238636;color:white;font-weight:600}.login-error{padding:9px;background:#4a2020;color:#ff9b95;border-radius:5px}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-screen" role="status" aria-live="polite"><h1>Code Workspace</h1><div class="module-loading"><span class="boot-spinner" aria-hidden="true"></span>正在加载，请稍候…</div></div></div>
    <noscript>Code Workspace 需要启用 JavaScript 才能使用。</noscript>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
