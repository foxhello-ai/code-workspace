name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows-smoke:
    name: Verify Windows installer scripts (${{ matrix.powershell }})
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        powershell: [powershell.exe, pwsh.exe]
    env:
      CODE_WORKSPACE_TEST_POWERSHELL: ${{ matrix.powershell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/install.test.mjs scripts/service-manager.test.mjs

  build:
    name: Verify installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "$expected"

      - name: Use stable Git line endings in test repositories
        run: git config --global core.autocrlf false

      - name: Install build dependencies
        run: npm ci

      - name: Typecheck and build production files
        id: compile
        run: npm run typecheck && npm run build

      - name: Verify application
        run: npm test

      - name: Build release archive with platform dependencies
        id: package
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: node scripts/package-release.mjs

      - name: Verify installation, upgrades, and production Git APIs
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$RUNNER_OS" = "Windows" ]; then
            export CODE_WORKSPACE_TEST_ARCHIVE="release/code-workspace-$version-windows-x64.zip"
          else
            export CODE_WORKSPACE_TEST_ARCHIVE="release/code-workspace-$version.tar.gz"
          fi
          node --test scripts/install.test.mjs scripts/service-manager.test.mjs

      - name: Save verified release assets
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.sha256
          if-no-files-found: error

  publish:
    name: Publish verified GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.tar.gz release/*.zip release/*.sha256 --title "Code Workspace $RELEASE_TAG" --generate-notes
