name: Remove superseded sensitive release data

on:
  push:
    branches: [main]
    paths: [.github/workflows/security-cleanup.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const parameters = { owner: context.repo.owner, repo: context.repo.repo };
            const obsoleteTags = new Set(['v1.1.0', 'v1.1.1', 'v1.1.2']);
            // Only the releases known to contain the removed default password.
            for (const tag of obsoleteTags) {
              try {
                const { data } = await github.rest.repos.getReleaseByTag({ ...parameters, tag });
                await github.rest.repos.deleteRelease({ ...parameters, release_id: data.id });
                core.info(`Removed superseded release ${tag}`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { ...parameters, per_page: 100 });
            const obsoleteRuns = runs.filter(run => run.id !== context.runId && (
              new Date(run.created_at) < new Date('2026-10-26T09:40:00Z') && run.head_sha !== context.sha ||
              obsoleteTags.has(run.head_branch)
            ));
            for (const run of obsoleteRuns) {
              if (run.status !== 'completed') {
                try { await github.rest.actions.cancelWorkflowRun({ ...parameters, run_id: run.id }); }
                catch (error) { if (![404, 409].includes(error.status)) throw error; }
                for (let attempt = 0; attempt < 20; attempt++) {
                  const { data } = await github.rest.actions.getWorkflowRun({ ...parameters, run_id: run.id });
                  if (data.status === 'completed') break;
                  await new Promise(resolve => setTimeout(resolve, 3000));
                }
              }
              await github.rest.actions.deleteWorkflowRun({ ...parameters, run_id: run.id });
            }
            core.info(`Removed ${obsoleteRuns.length} superseded workflow runs and their logs/artifacts.`);
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, { ...parameters, per_page: 100 });
            for (const cache of caches) await github.rest.actions.deleteActionsCacheById({ ...parameters, cache_id: cache.id });
            core.info(`Removed ${caches.length} previous build caches.`);
